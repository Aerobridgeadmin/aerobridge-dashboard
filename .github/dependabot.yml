version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "SebastianRLHR"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor/patch to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
